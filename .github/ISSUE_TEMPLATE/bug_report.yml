name: Bug report / 问题报告
description: Report a reproducible CompoSe problem / 报告可以复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传含有隐私内容的项目或媒体文件。Do not upload private projects or media.
  - type: input
    id: version
    attributes:
      label: CompoSe version / 版本
      placeholder: 0.9.0 (93)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model / 系统和机型
      placeholder: macOS 14.7, MacBook Pro M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the smallest sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
