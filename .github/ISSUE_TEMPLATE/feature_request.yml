name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow / 使用场景
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 建议方案
    validations:
      required: true
